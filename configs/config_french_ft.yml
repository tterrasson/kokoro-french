batch_size: 2
grad_accum: 4
epochs: 15
epochs_1st: 15
epochs_2nd: 35
save_freq: 1
pretrained_model: "../training/kokoro_base.pth"
first_stage_path: "first_stage.pth"
load_only_params: true
second_stage_load_pretrained: false  # false = load from first_stage.pth (recommended)
log_interval: 10
torch_compile:
  enabled: false
  modules: ["bert_encoder"]  # Use ["bert_encoder"] or "safe" to opt in conservatively
  mode: "default"
  fullgraph: false
  dynamic: true
  backend: "inductor"
  recompile_limit: 8
# ─────────────────────────────────────────────────────────────────────────────
# Kokoro French Fine-Tuning Config
# ─────────────────────────────────────────────────────────────────────────────
# Based on StyleTTS2 config_ft.yml, adapted for:
# - Kokoro-82M architecture (ISTFTNet vocoder + optional diffusion style sampler)
# - French multi-speaker fine-tuning
# - Conservative fine-tuning from pre-trained English checkpoint
# ─────────────────────────────────────────────────────────────────────────────

# ── Logging ──────────────────────────────────────────────────────────────────
log_dir: "logs/kokoro-french"

# ── Data ─────────────────────────────────────────────────────────────────────
data_params:
  train_data: "../training/train_list.txt"
  val_data: "../training/val_list.txt"
  root_path: "../dataset/audio"
  OOD_data: "../training/OOD_texts.txt"
  min_length: 50                    # min phoneme sequence length (chars)
  num_workers:  16                  # CPU workers for data loading

# ── Preprocessing ────────────────────────────────────────────────────────────
preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300
    n_mels: 80
    fmin: 0
    fmax: 8000

# ── Model Architecture ──────────────────────────────────────────────────────
# Must match Kokoro-82M exactly to load pre-trained weights
model_params:
  dim_in: 64
  n_token: 178                      # phoneme vocabulary size (IPA + punctuation)
  hidden_dim: 512                   # model hidden dimension
  style_dim: 128                    # style/speaker embedding dimension (x2 = 256 total in voicepack)
  max_dur: 50                       # max duration per phoneme (in frames)
  multispeaker: true                # multi speaker fine-tuning
  n_mels: 80                        # mel spectrogram bands
  dropout: 0.2
  n_layer: 3                        # number of layers in text encoder / predictor
  text_encoder_kernel_size: 5

  decoder:
    type: istftnet                  # Kokoro uses ISTFTNet, NOT hifigan
    upsample_rates: [10, 6]
    upsample_kernel_sizes: [20, 12]
    upsample_initial_channel: 512
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    gen_istft_n_fft: 20
    gen_istft_hop_size: 5

  # PLBERT config (phoneme-level BERT for text understanding)
  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

  plbert:
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 2048
    max_position_embeddings: 512
    num_hidden_layers: 12
    dropout: 0.1

  # SLM discriminator (WavLM) — used in stage 2 only
  slm:
    model: "microsoft/wavlm-base-plus"
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

  discriminators:
    mpd:
      periods: [2, 3, 5, 7, 11, 17]
    msd:
      log_mag: true
      fft_sizes: [1024, 2048, 512]
      hop_sizes: [120, 240, 50]
      win_lengths: [600, 1200, 240]
    msstft:
      enabled: true
      log_mag: true
      channels: 32
      resolutions:
        - [1024, 256, 1024]
        - [2048, 512, 2048]
        - [512, 128, 512]
    subband:
      enabled: true
      log_mag: true
      fft_size: 1024
      hop_size: 256
      win_length: 1024
      channels: 16
      bands:
        - [0, 64]
        - [64, 192]
        - [192, 384]
        - [384, null]
    wd:
      dropout_p: 0.05
      return_fmaps: false
      use_group_norm: false

# ── Loss Weights ─────────────────────────────────────────────────────────────
loss_params:
  lambda_gen: 1.0
  lambda_gen_start: 0.05
  lambda_mel: 5.0                   # mel reconstruction loss
  lambda_dur: 1.0                   # duration prediction loss
  lambda_ce: 20.0                   # duration cross-entropy loss
  lambda_F0: 1.0                    # F0 (pitch) prediction loss
  lambda_norm: 1.0                  # energy/norm prediction loss
  lambda_s2s: 1.0                   # sequence-to-sequence loss
  lambda_mono: 1.0                  # monotonic alignment loss
  lambda_slm: 1.0                   # SLM adversarial (0 = disabled for stage 1)
  lambda_slm_start: 0.05
  lambda_msstft_adv: 0.10
  lambda_msstft_fm: 0.50
  lambda_subband_adv: 0.05
  lambda_subband_fm: 0.25
  lambda_diff: 1.0                  # diffusion loss for style sampler
  lambda_sty: 1.0                   # style reconstruction from sampled style
  TMA_epoch: 0                      # start alignment from epoch 0 (fine-tuning, not training from scratch)
  diff_epoch: 0                     # train diffusion from the start of stage 2
  joint_epoch: 3                    # start adversarial joint training after diffusion warmup
  adv_warmup_epochs: 3
  slmadv_warmup_epochs: 3
  real_audio_mix_warmup_epochs: 3

# ── Optimizer ────────────────────────────────────────────────────────────────
optimizer_params:
  lr: 0.0001                        # main learning rate
  bert_lr: 0.00001                  # lower LR for PLBERT (mostly frozen knowledge)
  ft_lr: 0.0001                     # fine-tuning LR for acoustic modules
  pct_start: 0.0                    # no warmup (fine-tuning from pretrained)
  final_div_factor: 5               # LR decays 5x by end of training
  grad_clip: 5.0                    # max gradient norm to prevent spikes

# ── Pitch Extractor ──────────────────────────────────────────────────────────
# StyleTTS2 uses JDC pitch extractor
# If Utils/JDC/bst.t7 is not available, the training code falls back to other methods
F0_path: "Utils/JDC/bst.t7"

# ── ASR Alignment Model ─────────────────────────────────────────────────────
# StyleTTS2's pre-trained alignment model (English)
# May need to be adapted for German or set TMA_epoch=0 to learn from scratch
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"

# ── PLBERT ───────────────────────────────────────────────────────────────────
PLBERT_dir: "Utils/PLBERT/"

slmadv_params:
  min_len: 30
  max_len: 500
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
