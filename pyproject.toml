[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokoro-french"
version = "0.1.0"
description = "Fine-tuning Kokoro-82M for French TTS using StyleTTS2"
readme = "README.md"
authors = [
    { name="semidark" },
    { name="Thibault Terrasson" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "accelerate>=1.13.0",
    "click>=8.4.0",
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "espeakng-loader>=0.2.4",
    "huggingface-hub",
    "ipython>=8.39.0",
    "librosa>=0.11.0",
    "loguru",
    "matplotlib>=3.10.9",
    "munch>=4.0.0",
    "numpy",
    "openai-whisper>=20250625",
    "pandas>=2.3.3",
    "phonemizer>=3.3.0",
    "resemblyzer>=0.1.4",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchcodec>=0.13.0",
    "torchvision",
    "tqdm>=4.67.0",
    "transformers",
]

[project.scripts]
kokoro = "kokoro.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kokoro/kokoro", "misaki"]

[tool.uv]
override-dependencies = [
    "lxml>=5.4.0",
    "rpds-py>=0.23.0",
    "rdflib>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/tterrasson/kokoro-french"
Repository = "https://github.com/tterrasson/kokoro-french"
Upstream = "https://github.com/hexgrad/kokoro"
